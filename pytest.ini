[pytest]
# Collection is confined to tools/. The repository root holds large data trees and the
# .venv/.rlib symlinks provisioned by `make setup`, none of which pytest should walk.
testpaths = tools
norecursedirs =
    .git
    .venv
    .rlib
    data
    figure_data
    final_plots
    final_outputs
    outputs
    logs
    src
addopts = -q -p no:cacheprovider
