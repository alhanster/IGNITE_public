[pytest]
# Collection is confined to tests/. The repository root holds large data trees and the
# .venv/.rlib symlinks provisioned by `make setup`, none of which pytest should walk.
testpaths = tests
norecursedirs =
    .git
    .venv
    .rlib
    data
    figure_data
    final_plots
    final_outputs
    outputs
    logs
    src
    tools
addopts = -q -p no:cacheprovider
